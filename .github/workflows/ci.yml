name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev,chroma]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      - run: pytest --cov=aiplatform --cov-report=term-missing:skip-covered --cov-fail-under=85
  image:
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t agent-platform .
      - name: smoke test
        run: |
          docker run -d --name app -p 8000:8000 agent-platform
          for _ in $(seq 10); do
            curl -fsS localhost:8000/health && exit 0
            sleep 1
          done
          docker logs app
          exit 1
