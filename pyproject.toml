[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-agent-platform"
version = "0.1.0"
description = "Referência de arquitetura para IA generativa: RAG, agentes com tetos, portas e adaptadores."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.116",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.10",
  "prometheus-client>=0.21",
]

[project.optional-dependencies]
langchain = ["langchain-core>=0.3", "langchain-openai>=0.2"]
chroma = ["chromadb>=0.5"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "pytest-cov>=5", "httpx>=0.28", "langchain-core>=0.3"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.coverage.run]
omit = ["*/main.py", "*/chroma_store.py"]  # composição e adaptador opcional

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=aiplatform --cov-report=term-missing:skip-covered --cov-fail-under=85"
